spring:
  application:
    name: benchmark
  main:
    web-application-type: none
    banner-mode: off
  http:
    clients:
      # A local model can take minutes on a long turn.
      connect-timeout: 10s
      read-timeout: 15m
  ai:
    # Keys come from the environment or a git-ignored .env at the repo root. They're never logged or recorded.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never

bench:
  app-url: ${APP_BASE_URL:http://localhost:8080}
  admin-key: ${ADMIN_KEY:admin-dev-key}
  servers:
    endpoint: ${ENDPOINT_MCP_URL:http://localhost:8081}
    workflow: ${WORKFLOW_MCP_URL:http://localhost:8082}
  fixtures-dir: fixtures
  results-dir: results
  catalog-mode: verify
  limits:
    max-model-calls: 30
    max-tool-calls: 60
    model-retries: 3
    retry-backoff: 10s
  models:
    claude:
      provider: anthropic
      model: claude-opus-4-8
      max-tokens: 8192
    gpt:
      provider: openai
      model: gpt-5
      max-tokens: 16000
    qwen:
      provider: ollama
      model: qwen3.6:35b-a3b-nvfp4
      max-tokens: 8192
      num-ctx: 32768
      temperature: 0.7
      top-p: 0.8
      top-k: 20
      think: false

logging:
  level:
    root: WARN
    com.davidparry.tooldesign.benchmark: INFO
    # Netty falls back to the system resolver on macOS and says so at ERROR on every start.
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF
